name: Sync Stats (Daily)

on:
  schedule:
    - cron: "0 2 */2 * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/sync-stats.ts
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
